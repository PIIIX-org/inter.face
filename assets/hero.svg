<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="t d">
<title id="t">inter.face: named values, not adjectives</title>
<desc id="d">A DIRECTION.md page on paper. Six rows: an adjective is struck through and replaced by the value it became in a real run: warm paper becomes #fbf8f1, deep ink #0e2e2c, coral #c63f28, tappable 44px, readable 60rem, light 500.</desc>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#272625} .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif} .mut{fill:#6a6967}
.adj{animation:strike 9s linear infinite} .val{opacity:0;animation:appear 9s linear infinite} .bar{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%;animation:bar 9s linear infinite}
@keyframes strike{0%,30%{fill:#272625}45%,100%{fill:#6a6967}}
@keyframes bar{0%,30%{transform:scaleX(0)}45%,100%{transform:scaleX(1)}}
@keyframes appear{0%,40%{opacity:0}55%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){ .a,.a *{animation:none !important} .adj{text-decoration:line-through} .val{opacity:1} }
</style>
<rect width="1200" height="420" fill="#f5f9fb"/>
<text x="56" y="92" font-size="46" class="serif" letter-spacing="-1">inter.face</text>
<text x="56" y="124" font-size="13" class="mut">art direction for any interface · stops before code</text>
<text x="56" y="380" font-size="11" class="mut">runs/taha-portfolio/tokens.json</text>
<g transform="translate(560,48)">
<rect x="0" y="0" width="584" height="340" fill="#ffffff" stroke="#dcdad9"/>
<text x="24" y="34" font-size="11" class="mut" letter-spacing="2">DIRECTION.md</text>
<line x1="24" y1="46" x2="560" y2="46" stroke="#dcdad9"/>
<text x="24" y="82" font-size="13" class="mut">color.field</text>
<g class="a"><text x="250" y="82" font-size="14" class="adj" style="animation-delay:0.0s">warm paper</text>
<rect x="250" y="77" width="86" height="1.5" fill="#c63f28" class="bar" style="animation-delay:0.0s"/>
<rect x="440" y="70" width="14" height="14" fill="#fbf8f1" stroke="#dcdad9" class="val" style="animation-delay:0.0s"/><text x="462" y="82" font-size="14" class="val" style="animation-delay:0.0s">#fbf8f1</text></g>
<text x="24" y="118" font-size="13" class="mut">color.line-primary</text>
<g class="a"><text x="250" y="118" font-size="14" class="adj" style="animation-delay:0.9s">deep ink</text>
<rect x="250" y="113" width="69" height="1.5" fill="#c63f28" class="bar" style="animation-delay:0.9s"/>
<rect x="440" y="106" width="14" height="14" fill="#0e2e2c" stroke="#dcdad9" class="val" style="animation-delay:0.9s"/><text x="462" y="118" font-size="14" class="val" style="animation-delay:0.9s">#0e2e2c</text></g>
<text x="24" y="154" font-size="13" class="mut">color.redline</text>
<g class="a"><text x="250" y="154" font-size="14" class="adj" style="animation-delay:1.8s">coral</text>
<rect x="250" y="149" width="43" height="1.5" fill="#c63f28" class="bar" style="animation-delay:1.8s"/>
<rect x="440" y="142" width="14" height="14" fill="#c63f28" stroke="#dcdad9" class="val" style="animation-delay:1.8s"/><text x="462" y="154" font-size="14" class="val" style="animation-delay:1.8s">#c63f28</text></g>
<text x="24" y="190" font-size="13" class="mut">size.target-min</text>
<g class="a"><text x="250" y="190" font-size="14" class="adj" style="animation-delay:2.7s">tappable</text>
<rect x="250" y="185" width="69" height="1.5" fill="#c63f28" class="bar" style="animation-delay:2.7s"/>
<text x="440" y="190" font-size="14" class="val" style="animation-delay:2.7s">44px</text></g>
<text x="24" y="226" font-size="13" class="mut">size.measure-body</text>
<g class="a"><text x="250" y="226" font-size="14" class="adj" style="animation-delay:3.6s">readable</text>
<rect x="250" y="221" width="69" height="1.5" fill="#c63f28" class="bar" style="animation-delay:3.6s"/>
<text x="440" y="226" font-size="14" class="val" style="animation-delay:3.6s">60rem</text></g>
<text x="24" y="262" font-size="13" class="mut">font.weight.body</text>
<g class="a"><text x="250" y="262" font-size="14" class="adj" style="animation-delay:4.5s">light</text>
<rect x="250" y="257" width="43" height="1.5" fill="#c63f28" class="bar" style="animation-delay:4.5s"/>
<text x="440" y="262" font-size="14" class="val" style="animation-delay:4.5s">500</text></g>
<text x="24" y="308" font-size="11" fill="#b35b00" letter-spacing="2">GATE A · SIGNED 2026-08-06</text>
</g></svg>